# OpenAPI 摘要（REST + 工具 + 服务键）—— CLI/Skill/Web 三端对齐的唯一事实源
plugin: dsh-plugin-panel-core
base: /api
endpoints:
  - GET /api/panel/depts · GET /api/panel/:dept/overview · GET /api/panel/:dept/board（panel.read）
  - GET/PUT /api/panel/:dept/widgets · GET/PUT /api/panel/:dept/kpis（读 panel.read / 写 panel.config.write）
  - GET/POST /api/panel/:dept/channels · GET/POST /api/panel/:dept/messages · POST /api/panel/messages/:id/card-action
  - GET/POST /api/panel/:dept/tasks · POST /api/panel/tasks/:id/transition（panel.task.write）
  - GET /api/panel/:dept/artifacts · GET /api/panel/:dept/poll（降级轮询）
  - GET /api/panel/:dept/skills（panel.read）· POST /api/panel/:dept/skills/invoke（panel.write；J1 直调：降级=200+ok:false，鉴权/范围=403/400）
  - POST /api/panel/stream-ticket（panel.read + 部门范围校验；换取 ≤60s 一次性 SSE 票据，H4）
  - GET /api/panel/stream?dept=&ticket=|token=（SSE；EventSource 无法带 Bearer：首选一次性 ticket 消费即焚，?token= 旧通道自校验 fail-closed）
  - GET /api/panel/industries（三态）· POST /api/panel/industries/:code/activate-requests
  - GET /api/panel/scenegraph?industry=（scenegraph.read）· POST /api/panel/scenegraphs/reload（panel.config.write）
  - GET /panel（面板 SPA 页面） · GET /api/panel/orgs（部门树）
  - GET/POST /api/panel/models（模型端点登记） · DELETE /api/panel/models/:id · POST /api/panel/models/:id/test（连通性测试）
  - POST /api/panel/channels/:id/read（频道已读游标）
  - PUT /api/panel/:dept/config（面板配置） · PUT /api/panel/:dept/agents（Agent 阵容） · POST /api/panel/:dept/artifacts（产物登记）
  - POST /api/panel/:dept/scenes/:scene/diagnose（场景诊断） · POST /api/panel/:dept/scenes/:scene/sync-dingtalk（场景钉钉同步）
  - GET /api/panel/board（panel.read；战略看板：卡片包角色×平台过滤 + 漏斗/WAIC/ROI 估算聚合，DeptAI-UI-DSH 收编 2026-10-29）
  - POST /api/panel/:dept/agent-stream（panel.write；SSE-over-POST 流式应答：start/delta/done/fallback 逐事件，应答照常落库广播）
  - GET /api/panel/mfg/catalog · GET /api/panel/mfg/roadmap · GET /api/panel/mfg/releases · GET /api/panel/mfg/evaluation-plan · GET /api/panel/mfg/tools/:id/template（panel.read；制造工具箱目录/选题/放行/评估面）
  - POST /api/panel/mfg/tools/:id/run · POST /api/panel/mfg/tools/:id/export（panel.write；工具执行与结果导出）
  - POST /api/panel/mfg/evaluate · POST /api/panel/mfg/releases · DELETE /api/panel/mfg/releases/:skillId（panel.config.write；评估发起与放行签署/撤回——放行是治理动作）
  - GET /api/panel/ddws/status · GET /api/panel/ddws/login（panel.read；本地钉钉面 dws CLI 桥状态与登录会话轮询）
  - POST /api/panel/ddws/install · POST /api/panel/ddws/login · DELETE /api/panel/ddws/login · PUT/DELETE /api/panel/ddws/bind（panel.config.write；CLI 安装/设备流登录/群绑定）
  - POST /api/panel/ddws/test · POST /api/panel/ddws/pull（panel.write；连通性测试与入向消息拉取，失败 200+ok:false 诚实降级）
tools:
  - panel_agents_list
  - panel_msg_send
  - panel_task_create
  - panel_task_transition
  - panel_scene_diag
  - panel_widget_data
  - panel_agent_invoke
  - panel_skill_invoke
  - panel_board_digest
  - panel_mfg_tools_list
  - panel_mfg_tool_run
  - panel_mfg_roadmap
services:
  - key: panel
    access: ctx.panel
    description: 部门面板域：deptConfigs/channels/messages/tasks/artifacts/readCursors/activations + panelAgentRuntime + widget 求值
