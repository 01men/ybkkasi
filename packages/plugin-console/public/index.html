<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- 社交分享卡片（2026-11-10）：此前完全没有 og/twitter 标签，任何平台分享出去
       都是无标题无图的裸链接。GitHub README、公众号、HN 都吃这一套。 -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="元冰可 AIOS">
  <meta property="og:title" content="元冰可 AIOS · 企业 AI 运行与治理平台">
  <meta property="og:description" content="把企业的 MCP 服务 / Skill / Agent / AI 应用统一成可管、可算、可审的资产。MIT · 完全自托管。">
  <meta property="og:url" content="https://ybkkasi.com/">
  <meta property="og:image" content="https://ybkkasi.com/ybk-mark.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="元冰可 AIOS · 企业 AI 运行与治理平台">
  <meta name="twitter:description" content="把企业的 MCP 服务 / Skill / Agent / AI 应用统一成可管、可算、可审的资产。MIT · 完全自托管。">
  <meta name="twitter:image" content="https://ybkkasi.com/ybk-mark.png">
  <link rel="canonical" href="https://ybkkasi.com/">
  <link rel="icon" href="/ybk-mark.png">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/home.css">
  <link rel="stylesheet" href="/css/themes.css">
  <!-- 首屏预载（2026-10-18 · 首屏修复）：页面模块已改动态 import，落地页只可能是
       营销首页（免会话裸落地）或工作台（演示态/已登录裸落地）。这两块提前发起，
       与 app.js 并行下载，避免「外壳到了才排队取页」的二次等待。其余页面按需取。 -->
  <link rel="modulepreload" href="/js/pages/home.js">
  <link rel="modulepreload" href="/js/pages/dashboard.js">
</head>
<body>
  <div id="app">
    <!-- 加载屏：暖纸底 + 深青蓝文字（与2026-10-14 设计适配主题一致；此处尚无 CSS 变量可用，故内联色值）。
         2026-10-19 PH 首发日增强：公网经Cloudflare 隧道，首屏到内容可交互约 9s（本地 ~0.3s）。
         这段时间里访客原本只能看到一行「正在加载控制台…」，等于白等 —— 而这正是 PH 访客
         从落地页点「Open the live demo」后的必经路径，等同漏斗最后一步流失。
         改为在加载屏直接说清「正在加载什么」，把等待变成信息而不是空白。 -->
    <div style="height:100vh;display:grid;place-items:center;background:#f8f6f3">
      <div style="text-align:center;color:#0a5f87;max-width:520px;padding:0 24px">
        <img src="/ybk-mark.png" alt="元冰可" style="width:46px;height:46px;margin:0 auto 14px;border-radius:12px;display:block">
        <div style="font-size:15px;font-weight:600;letter-spacing:.02em" id="ybkBootTitle">正在加载控制台…</div>
        <div style="margin-top:10px;font-size:13px;line-height:1.7;color:#4a6572" id="ybkBootStats">正在装载 29 个插件包 · 94 个权限点 · 499 个 REST 路由 · 98 个 MCP 工具<br>
          正在连接当前配置的运行实例</div>
        <div style="margin-top:16px;height:3px;width:180px;margin-left:auto;margin-right:auto;border-radius:2px;background:#dce6ea;overflow:hidden">
          <div style="width:40%;height:100%;border-radius:2px;background:#0a5f87;animation:ybkBootSlide 1.4s ease-in-out infinite"></div>
        </div>
        <style>@keyframes ybkBootSlide{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}</style>
        <noscript>
          <!-- 无 JS / 爬虫可见的真实落地内容（2026-11-10 补）。
               此前 noscript 只有一句「需要 JavaScript」，导致首屏 HTML 里
               h1/main/仓库链接全为 0：搜索引擎与任何不执行 JS 的抓取器
               拿到的是一张白纸，社交平台分享出去是无标题裸链接。
               这块内容在 JS 正常时会随 #app 被 app.js 覆盖，对真实访客零干扰。 -->
          <main style="margin-top:18px;text-align:left;font-size:13px;line-height:1.75;color:#3d5561">
            <h1 style="font-size:17px;font-weight:600;color:#0a5f87;margin:0 0 8px">元冰可 AIOS · 企业 AI 运行与治理平台</h1>
            <p style="margin:0 0 10px">
              把企业的 MCP 服务 / Skill / Agent / AI 应用统一成<strong>可管、可算、可审</strong>的资产：
              一套身份、一套权限、一套计量、一套审计。
            </p>
            <p style="margin:0 0 10px;font-size:12px;color:#5a7480">
              30 个插件 · 94 个权限点 · 499 条 REST 路由 · 98 个 MCP 工具 · MIT 许可 · 完全自托管
            </p>
            <p style="margin:0 0 10px">
              控制台需要 JavaScript。可直接访问
              <a href="/launch" style="color:#0a5f87;font-weight:600">静态介绍页</a>，
              或前往
              <a href="https://github.com/01men/ybkkasi" style="color:#0a5f87;font-weight:600">GitHub 仓库</a>
              查看源码与部署文档。
            </p>
            <p style="margin:0;font-size:12px;color:#5a7480">
              在线演示：
              <a href="https://demo.ybkkasi.com/" style="color:#0a5f87">demo.ybkkasi.com</a>
            </p>
          </main>
        </noscript>
      </div>
    </div>
  </div>
  <!-- 加载屏首帧定语（2026-10-19 PH 首发日）。i18n 引擎的词典是异步 fetch，
       公网经 Cloudflare 隧道约 1 个 RTT 之后才到手；本机 0.3s 加载完反而是词典
       还没到就已被 app.js 接管。两种时序都导致「英文访客的首屏是中文」。
       PH 访客绝大多数是英文用户，首屏语言 = 对产品是否面向我的第一判断，
       所以在首个内联脚本里按 navigator.language 直接定语，零网络请求。
       与 i18n.js 的决议链同口径（localStorage rq_lang > navigator > zh-CN）。 -->
  <script>
    (function () {
      var pick = (function () { try { return localStorage.getItem('rq_lang') || '' } catch (e) { return '' } })()
      var nav = (navigator.language || 'zh-CN').toLowerCase()
      var loc = pick === 'auto' || !pick ? (nav.indexOf('zh') === 0 ? 'zh' : nav.indexOf('ja') === 0 ? 'ja' : 'en') : pick.toLowerCase()
      var T = {
        zh: ['正在加载控制台…', '正在装载 29 个插件包 · 94 个权限点 · 499 个 REST 路由 · 98 个 MCP 工具<br>正在连接当前配置的运行实例'],
        en: ['Loading console…', 'Loading 29 plugin packages · 94 permission points · 499 REST routes · 98 MCP tools<br>Connecting to your configured instance'],
        ja: ['コンソールを読み込み中…', '29 プラグイン・94 権限ポイント・499 REST ルート・98 MCP ツールを読み込み中<br>設定された実行環境に接続しています']
      }
      var t = T[loc] || T.zh
      var title = document.getElementById('ybkBootTitle')
      var stats = document.getElementById('ybkBootStats')
      if (title) title.textContent = t[0]
      if (stats) stats.innerHTML = t[1]
    })()
  </script>
  <script type="module" src="/js/i18n.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
